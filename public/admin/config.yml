backend:
  name: github
  repo: Saito205/Ichiyo
  branch: main
  # !!! THAY bằng địa chỉ Cloudflare Worker (decap-proxy) của bạn, xem README.md
  base_url: https://decap-proxy.ichiyo.workers.dev

# Khi chạy thử trên máy: npx decap-server  (rồi mở http://localhost:5173/admin/)
local_backend: true

publish_mode: simple
media_folder: public/uploads
public_folder: /uploads
site_url: https://saito205.github.io/Ichiyo/
display_url: https://saito205.github.io/Ichiyo/

slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: products
    label: Sản phẩm
    label_singular: Sản phẩm
    folder: content/products
    create: true
    delete: true
    extension: json
    format: json
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}} — {{category}}"
    fields:
      - { label: Tên sản phẩm, name: title, widget: string }
      - { label: Danh mục, name: category, widget: string, required: false }
      - { label: Mô tả ngắn, name: summary, widget: text, required: false }
      - { label: Mô tả chi tiết, name: description, widget: text, required: false, hint: "Để trống 1 dòng để xuống đoạn mới" }
      - { label: Ảnh đại diện, name: cover, widget: image, required: false }
      - label: Thư viện ảnh
        name: gallery
        widget: list
        required: false
        field: { label: Ảnh, name: image, widget: image }
      - { label: Liên kết ngoài (không bắt buộc), name: link, widget: string, required: false }
      - { label: Nổi bật (hiện ở trang chủ), name: featured, widget: boolean, default: false, required: false }
      - { label: Thứ tự (số nhỏ hiện trước), name: order, widget: number, value_type: int, default: 0, required: false }

  - name: settings
    label: Cài đặt website
    files:
      - label: Thông tin chung
        name: site
        file: content/site.json
        format: json
        fields:
          - { label: Tên thương hiệu, name: name, widget: string }
          - { label: Khẩu hiệu, name: tagline, widget: string, required: false }
          - { label: Tiêu đề trang chủ, name: heroTitle, widget: string }
          - { label: Mô tả trang chủ, name: heroText, widget: text, required: false }
          - { label: Ảnh trang chủ, name: heroImage, widget: image, required: false }
          - { label: Tiêu đề giới thiệu, name: aboutTitle, widget: string, required: false }
          - { label: Nội dung giới thiệu, name: aboutText, widget: text, required: false }
          - label: Liên hệ
            name: contact
            widget: object
            fields:
              - { label: Email, name: email, widget: string, required: false }
              - { label: Điện thoại, name: phone, widget: string, required: false }
              - { label: Zalo (link), name: zalo, widget: string, required: false }
              - { label: Facebook (link), name: facebook, widget: string, required: false }
              - { label: Instagram (link), name: instagram, widget: string, required: false }
              - { label: Địa chỉ, name: address, widget: string, required: false }
          - { label: Chữ cuối trang, name: footer, widget: string, required: false }
